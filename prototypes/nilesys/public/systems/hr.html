<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الموارد البشرية · نيل سيستمز</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=774567a4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236d28d9'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>H</text></svg>" />
  <style>
    .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .emp { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: #fff; }
    .emp .nm { font-weight: 800; }
    .emp .st { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; display: inline-block; margin-top: 6px; }
    .st-present { background: #dcfce7; color: #166534; }
    .st-late { background: #fef3c7; color: #92400e; }
    .st-absent, .st-absent_not_recorded { background: #fee2e2; color: #b91c1c; }
    .st-leave { background: #ede9fe; color: #5b21b6; }
    .slip { font-family: var(--mono, monospace); }
    .slip table.tbl td, .slip table.tbl th { padding: 8px 10px; }
    @media print { .side, .topbar, .btn, .nav-item { display: none !important; } }
  </style>
</head>
<body data-title-key="hr.kicker">

  <div class="login-page hidden" id="loginView">
    <div class="login-card">
      <div class="card">
        <div class="row between mb-2">
          <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span data-brand-name>نيل سيستمز</span></a>
          <button class="btn btn-ghost btn-sm" id="langBtn2"></button>
        </div>
        <div class="kicker">الموارد البشرية</div>
        <h1>الحضور، الإجازات، والمرتب قبل يوم الصرف</h1>
        <p class="small muted mt-1">ادخل بحساب تجربة بضغطة — كلمة المرور <b class="mono">demo1234</b></p>
        <div class="mt-3" id="demoUsers"></div>
        <form id="loginForm" class="mt-2">
          <div class="field"><label class="label" for="lu">Username</label><input class="input" id="lu" autocomplete="username" /></div>
          <div class="field"><label class="label" for="lp">Password</label><input class="input" id="lp" type="password" value="demo1234" autocomplete="current-password" /></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div class="app hidden" id="appView">
    <aside class="side" id="side">
      <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span>الموارد البشرية</span></a>
      <button class="nav-item" data-view="day" data-roles="manager,hr"><span class="nav-ico">🗓️</span><span>لوحة اليوم</span></button>
      <button class="nav-item" data-view="attendance" data-roles="manager,hr"><span class="nav-ico">⏱️</span><span>الحضور</span></button>
      <button class="nav-item" data-view="employees" data-roles="manager,hr"><span class="nav-ico">👥</span><span>الموظفون</span></button>
      <button class="nav-item" data-view="leaves" data-roles="manager,hr"><span class="nav-ico">🌴</span><span>الإجازات</span></button>
      <button class="nav-item" data-view="payroll" data-roles="manager,hr"><span class="nav-ico">💰</span><span>المرتبات</span></button>
      <button class="nav-item" data-view="me"><span class="nav-ico">🧾</span><span>سجلي ومسيّري</span></button>
      <div class="spacer"></div>
      <button class="nav-item" id="logoutBtn"><span class="nav-ico">⎋</span><span>خروج</span></button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
        <b data-brand-name>مجموعة النيل</b>
        <span class="badge badge-brand">الموارد البشرية</span>
        <div class="who">
          <button class="btn btn-ghost btn-sm" id="langBtn3"></button>
          <span class="avatar" id="avatar">--</span>
          <div style="line-height:1.2">
            <div class="small" style="font-weight:700" id="userName"></div>
            <div class="small muted" id="userRole"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=774567a4"></script>
  <script src="/assets/js/core.js?v=774567a4"></script>
  <script src="/assets/js/hr.js?v=774567a4"></script>
</body>
</html>

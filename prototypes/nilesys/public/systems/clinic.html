<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام العيادة · نيل سيستمز</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=774567a4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230369a1'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>C</text></svg>" />
  <style>
    .appt { display: grid; grid-template-columns: 78px 1fr auto; gap: 12px; align-items: center;
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: #fff; }
    .appt[data-status="arrived"] { border-color: #2563eb; background: #eff6ff; }
    .appt[data-status="in_room"] { border-color: #f59e0b; background: #fffbeb; }
    .appt[data-status="done"] { opacity: .75; }
    .appt[data-status="no_show"], .appt[data-status="cancelled"] { opacity: .55; }
    .appt .time { font-family: var(--mono, monospace); font-weight: 900; font-size: 17px; }
    .appt .who { font-weight: 700; }
    .appt .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .rx { display: grid; grid-template-columns: 1.4fr 1fr 1fr 44px; gap: 6px; margin-bottom: 6px; }
    .rx input { min-width: 0; }
    @media (max-width: 700px) { .rx { grid-template-columns: 1fr 1fr; } .appt { grid-template-columns: 64px 1fr; } }
    .pill-state { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
    .s-booked { background: var(--info-bg, #eff6ff); color: var(--info, #1d4ed8); }
    .s-arrived { background: #dbeafe; color: #1e40af; }
    .s-in_room { background: #fef3c7; color: #b45309; }
    .s-done { background: #dcfce7; color: #047857; }
    .s-no_show, .s-cancelled { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body data-title-key="clinic.kicker">

  <div class="login-page hidden" id="loginView">
    <div class="login-card">
      <div class="card">
        <div class="row between mb-2">
          <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span data-brand-name>نيل سيستمز</span></a>
          <button class="btn btn-ghost btn-sm" id="langBtn2"></button>
        </div>
        <div class="kicker">نظام العيادة</div>
        <h1>الموعد، الكشف، الروشتة، والحساب</h1>
        <p class="small muted mt-1">ادخل بحساب تجربة بضغطة — كلمة المرور <b class="mono">demo1234</b></p>
        <div class="mt-3" id="demoUsers"></div>
        <form id="loginForm" class="mt-2">
          <div class="field"><label class="label" for="lu">Username</label><input class="input" id="lu" autocomplete="username" /></div>
          <div class="field"><label class="label" for="lp">Password</label><input class="input" id="lp" type="password" value="demo1234" autocomplete="current-password" /></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div class="app hidden" id="appView">
    <aside class="side" id="side">
      <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span>العيادة</span></a>
      <button class="nav-item" data-view="day"><span class="nav-ico">📅</span><span>يوم العيادة</span></button>
      <button class="nav-item" data-view="patients"><span class="nav-ico">🗂️</span><span>المرضى</span></button>
      <button class="nav-item" data-view="book"><span class="nav-ico">➕</span><span>حجز موعد</span></button>
      <button class="nav-item" data-view="doctors"><span class="nav-ico">🩺</span><span>الأطباء والأسعار</span></button>
      <button class="nav-item" data-view="summary"><span class="nav-ico">📈</span><span>التقارير</span></button>
      <button class="nav-item" data-view="shift"><span class="nav-ico">💵</span><span>الوردية والدرج</span></button>
      <div class="spacer"></div>
      <button class="nav-item" id="logoutBtn"><span class="nav-ico">⎋</span><span>خروج</span></button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
        <b data-brand-name>عيادة النيل</b>
        <span class="badge badge-brand">نظام العيادة</span>
        <div class="who">
          <button class="btn btn-ghost btn-sm" id="langBtn3"></button>
          <span class="avatar" id="avatar">--</span>
          <div style="line-height:1.2">
            <div class="small" style="font-weight:700" id="userName"></div>
            <div class="small muted" id="userRole"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=774567a4"></script>
  <script src="/assets/js/core.js?v=774567a4"></script>
  <script src="/assets/js/clinic.js?v=774567a4"></script>
</body>
</html>

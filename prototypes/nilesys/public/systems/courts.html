<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام حجز الملاعب · نيل سيستمز</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=774567a4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2315803d'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>K</text></svg>" />
  <style>
    .grid-wrap { overflow-x: auto; }
    .slotgrid { display: grid; gap: 6px; }
    .slot { border: 1px solid var(--line); border-radius: 9px; padding: 6px 4px; text-align: center;
      font-family: var(--mono, monospace); font-size: 12px; background: #fff; cursor: pointer; min-width: 62px; }
    .slot:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .slot[data-state="held"] { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    .slot[data-state="confirmed"] { background: #dbeafe; border-color: #2563eb; color: #1e40af; }
    .slot[data-state="played"] { background: #dcfce7; border-color: #15803d; color: #166534; }
    .slot[data-state="cancelled"], .slot[data-state="expired"] { background: #f3f4f6; color: #9ca3af; text-decoration: line-through; }
    .slot[data-state="free"]:hover { border-color: var(--brand); }
    .slot .who { display: block; font-family: var(--font, sans-serif); font-size: 10px; color: #475569;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 4px; }
    @media (max-width: 760px) { .slot { min-width: 54px; } }
  </style>
</head>
<body data-title-key="courts.kicker">

  <div class="login-page hidden" id="loginView">
    <div class="login-card">
      <div class="card">
        <div class="row between mb-2">
          <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span data-brand-name>نيل سيستمز</span></a>
          <button class="btn btn-ghost btn-sm" id="langBtn2"></button>
        </div>
        <div class="kicker">نظام الملاعب</div>
        <h1>الملعب فاضي ولا محجوز؟ في ثانية</h1>
        <p class="small muted mt-1">ادخل بحساب تجربة بضغطة — كلمة المرور <b class="mono">demo1234</b></p>
        <div class="mt-3" id="demoUsers"></div>
        <form id="loginForm" class="mt-2">
          <div class="field"><label class="label" for="lu">Username</label><input class="input" id="lu" autocomplete="username" /></div>
          <div class="field"><label class="label" for="lp">Password</label><input class="input" id="lp" type="password" value="demo1234" autocomplete="current-password" /></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div class="app hidden" id="appView">
    <aside class="side" id="side">
      <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span>الملاعب</span></a>
      <button class="nav-item" data-view="grid"><span class="nav-ico">🗓️</span><span>جدول اليوم</span></button>
      <button class="nav-item" data-view="bookings"><span class="nav-ico">📋</span><span>الحجوزات</span></button>
      <button class="nav-item" data-view="courts"><span class="nav-ico">⚽</span><span>الملاعب والأسعار</span></button>
      <button class="nav-item" data-view="summary"><span class="nav-ico">📈</span><span>التقارير</span></button>
      <button class="nav-item" data-view="shift"><span class="nav-ico">💵</span><span>الوردية والدرج</span></button>
      <div class="spacer"></div>
      <button class="nav-item" id="logoutBtn"><span class="nav-ico">⎋</span><span>خروج</span></button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
        <b data-brand-name>ملاعب النيل</b>
        <span class="badge badge-brand">نظام الملاعب</span>
        <div class="who">
          <button class="btn btn-ghost btn-sm" id="langBtn3"></button>
          <span class="avatar" id="avatar">--</span>
          <div style="line-height:1.2">
            <div class="small" style="font-weight:700" id="userName"></div>
            <div class="small muted" id="userRole"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=774567a4"></script>
  <script src="/assets/js/core.js?v=774567a4"></script>
  <script src="/assets/js/courts.js?v=774567a4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المواقع · نيل سيستمز</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=774567a4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f766e'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>W</text></svg>" />
  <style>
    .site-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff; }
    .site-card .top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
    .site-card .hd { font-weight: 800; font-size: 15px; }
    .st-live { background: #dcfce7; color: #166534; }
    .st-coming { background: #fef3c7; color: #92400e; }
    .st-off { background: #e2e8f0; color: #475569; }
    .lead-row-msg { max-width: 320px; }
    @media print { .side, .topbar, .btn, .nav-item { display: none !important; } }
  </style>
</head>
<body data-title-key="sites.kicker">

  <div class="login-page hidden" id="loginView">
    <div class="login-card">
      <div class="card">
        <div class="row between mb-2">
          <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span data-brand-name>نيل سيستمز</span></a>
          <button class="btn btn-ghost btn-sm" id="langBtn2"></button>
        </div>
        <div class="kicker">المواقع</div>
        <h1>كل موقع: حالته، زواره، ورسائله — من مكان واحد</h1>
        <p class="small muted mt-1">ادخل بحساب تجربة بضغطة — كلمة المرور <b class="mono">demo1234</b></p>
        <div class="mt-3" id="demoUsers"></div>
        <form id="loginForm" class="mt-2">
          <div class="field"><label class="label" for="lu">Username</label><input class="input" id="lu" autocomplete="username" /></div>
          <div class="field"><label class="label" for="lp">Password</label><input class="input" id="lp" type="password" value="demo1234" autocomplete="current-password" /></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div class="app hidden" id="appView">
    <aside class="side" id="side">
      <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span>لوحة المواقع</span></a>
      <button class="nav-item" data-view="overview"><span class="nav-ico">📊</span><span>نظرة عامة</span></button>
      <button class="nav-item" data-view="sites"><span class="nav-ico">🌐</span><span>المواقع</span></button>
      <button class="nav-item" data-view="content"><span class="nav-ico">✏️</span><span>المحتوى</span></button>
      <button class="nav-item" data-view="leads"><span class="nav-ico">📨</span><span>الرسائل</span></button>
      <button class="nav-item" data-view="views"><span class="nav-ico">👁️</span><span>الزيارات</span></button>
      <button class="nav-item" data-view="summary"><span class="nav-ico">📈</span><span>التقارير</span></button>
      <div class="spacer"></div>
      <button class="nav-item" id="logoutBtn"><span class="nav-ico">⎋</span><span>خروج</span></button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
        <b data-brand-name>مجموعة النيل</b>
        <span class="badge badge-brand">الموارد البشرية</span>
        <div class="who">
          <button class="btn btn-ghost btn-sm" id="langBtn3"></button>
          <span class="avatar" id="avatar">--</span>
          <div style="line-height:1.2">
            <div class="small" style="font-weight:700" id="userName"></div>
            <div class="small muted" id="userRole"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=774567a4"></script>
  <script src="/assets/js/core.js?v=774567a4"></script>
  <script src="/assets/js/sites-dash.js?v=774567a4"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام المطاعم · نيل سيستمز</title>
  <link rel="stylesheet" href="/assets/css/app.css?v=774567a4" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b45309'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>R</text></svg>" />
  <style>
    .floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .tcard { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: #fff;
      cursor: pointer; text-align: start; transition: transform .12s, box-shadow .12s, border-color .12s; }
    .tcard:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15,23,42,.08); border-color: var(--brand); }
    .tcard:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .tcard .tno { font-weight: 900; font-size: 17px; }
    .tcard .seats { font-size: 12px; color: var(--muted); }
    .tcard .amt { font-family: var(--mono, monospace); font-weight: 800; margin-top: 6px; }
    .tcard .st { position: absolute; inset-inline-end: 12px; inset-block-start: 12px; }
    .tcard[data-status="seated"] { border-color: #f59e0b; background: #fffbeb; }
    .tcard[data-status="reserved"] { border-color: #2563eb; background: #eff6ff; }
    .tcard[data-status="dirty"] { border-color: #9ca3af; background: #f3f4f6; }
    .order-grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .order-grid { grid-template-columns: 1fr; } }
    .menu-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; cursor: pointer; background: #fff; text-align: start; }
    .menu-item:hover:not(:disabled) { border-color: var(--brand); }
    .menu-item:disabled { opacity: .45; cursor: not-allowed; }
    .menu-item:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
    .menu-item .nm { font-weight: 700; font-size: 14px; }
    .menu-item .pr { font-family: var(--mono, monospace); font-weight: 800; color: var(--brand-600, #0f766e); }
    .line { display: flex; gap: 8px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
    .line .nm { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; }
    .kticket { border-inline-start: 4px solid #f59e0b; }
    .kticket .krow { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    .st-new { background: #fff7ed; color: #c2410c; }
    .st-cooking { background: #eff6ff; color: #1d4ed8; }
    .st-ready { background: #ecfdf5; color: #047857; }
  </style>
</head>
<body data-title-key="rest.kicker">

  <div class="login-page hidden" id="loginView">
    <div class="login-card">
      <div class="card">
        <div class="row between mb-2">
          <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span data-brand-name>نيل سيستمز</span></a>
          <button class="btn btn-ghost btn-sm" id="langBtn2"></button>
        </div>
        <div class="kicker">نظام المطاعم</div>
        <h1>من الترابيزة للمطبخ للحساب</h1>
        <p class="small muted mt-1">ادخل بحساب تجربة بضغطة — كلمة المرور <b class="mono">demo1234</b></p>
        <div class="mt-3" id="demoUsers"></div>
        <form id="loginForm" class="mt-2">
          <div class="field"><label class="label" for="lu">Username</label><input class="input" id="lu" autocomplete="username" /></div>
          <div class="field"><label class="label" for="lp">Password</label><input class="input" id="lp" type="password" value="demo1234" autocomplete="current-password" /></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">دخول</button>
        </form>
      </div>
    </div>
  </div>

  <div class="app hidden" id="appView">
    <aside class="side" id="side">
      <a class="brand" href="/"><span class="brand-mark" data-brand-logo>N</span><span>المطعم</span></a>
      <button class="nav-item" data-view="floor"><span class="nav-ico">🍽️</span><span>الصالة</span></button>
      <button class="nav-item" data-view="kitchen"><span class="nav-ico">👨‍🍳</span><span>المطبخ</span></button>
      <button class="nav-item" data-view="reservations"><span class="nav-ico">📅</span><span>الحجوزات</span></button>
      <button class="nav-item" data-view="summary"><span class="nav-ico">📈</span><span>ملخص اليوم</span></button>
      <button class="nav-item" data-view="shift"><span class="nav-ico">💵</span><span>الوردية والدرج</span></button>
      <div class="spacer"></div>
      <button class="nav-item" id="logoutBtn"><span class="nav-ico">⎋</span><span>خروج</span></button>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
        <b data-brand-name>مطعم النيل</b>
        <span class="badge badge-brand">نظام المطاعم</span>
        <div class="who">
          <button class="btn btn-ghost btn-sm" id="langBtn3"></button>
          <span class="avatar" id="avatar">--</span>
          <div style="line-height:1.2">
            <div class="small" style="font-weight:700" id="userName"></div>
            <div class="small muted" id="userRole"></div>
          </div>
        </div>
      </header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="/assets/js/i18n.js?v=774567a4"></script>
  <script src="/assets/js/core.js?v=774567a4"></script>
  <script src="/assets/js/restaurant.js?v=774567a4"></script>
</body>
</html>

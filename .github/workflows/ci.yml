name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prototype-tests:
    name: Prototype test suite (156 checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run prototype tests
        working-directory: prototypes/nilesys
        run: bash tools/run-tests.sh

  engines-tests:
    name: Engines typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npx vitest run engines apps
